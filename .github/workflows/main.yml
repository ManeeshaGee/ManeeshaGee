name: Generate Metrics & Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Generate the Snake Animation
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ManeeshaGee
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.MY_METRICS_TOKEN }}

      # 2. Generate Advanced Infographics (Lowlighter Metrics)
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.MY_METRICS_TOKEN }}
          user: ManeeshaGee
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          filename: github-metrics.svg

      # 3. Push the generated files to a branch called "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.MY_METRICS_TOKEN }}
