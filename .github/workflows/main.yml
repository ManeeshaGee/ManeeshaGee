name: Generate Metrics & Snake

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. Generate the Snake animation from your contribution grid
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: maneeshagee
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Generate the Advanced Infographic (Metrics)
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Using your custom token name here
          token: ${{ secrets.MY_METRICS_TOKEN }}
          
          # Options
          user: maneeshagee
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # Output file location
          filename: github-metrics.svg
          
          # We tell metrics to save the file to the 'dist' folder 
          # so we can push it together with the snake
          output_action: none 
      
      # Move metrics to dist folder if it wasn't saved there
      - name: Move Metrics to dist
        run: |
          mkdir -p dist
          mv github-metrics.svg dist/ 2>/dev/null || true

      # 3. Push the generated files to the 'output' branch
      # This branch is used only for hosting your SVG images
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
