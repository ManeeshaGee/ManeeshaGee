name: Generate Metrics & Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. Prepare a clean folder for the files
      - name: Prepare Folder
        run: mkdir -p dist

      # 2. Generate the Snake animation
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: maneeshagee
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Generate Advanced Metrics
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.MY_METRICS_TOKEN }}
          user: maneeshagee
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # CRITICAL SETTINGS:
          filename: github-metrics.svg
          output_action: none # This prevents it from committing to the main branch!
          
      # 4. Manually move the metrics file to the dist folder
      - name: Move Metrics to dist
        run: mv github-metrics.svg dist/

      # 5. Push EVERYTHING in the dist folder to the 'output' branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
